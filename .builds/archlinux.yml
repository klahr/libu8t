image: archlinux
packages:
  - valgrind
  - cmake
  - debuginfod
sources:
  - https://git.sr.ht/~klahr/libu8t
  - https://git.sr.ht/~klahr/unit-check
tasks:
  - setup: |
      cd unit-check
      mkdir -p build
      cd build
      cmake ..
      make
      sudo make install
  - build: |
      cd libu8t
      cmake -S . -B build
      cmake --build build
  - run_tests: |
      cd libu8t/build
      ctest -j$(nproc) --output-on-failure
  - run_valgrind: |
      cd libu8t/build
      export DEBUGINFOD_URLS="https://debuginfod.archlinux.org"
      for test in tests/test_*; do
        [ -x "$test" ] || continue
        echo "Running valgrind on $test"
        valgrind --leak-check=full --error-exitcode=1 "$test" || exit 1
      done
triggers:
  - action: email
    condition: failure
    to: klahr@r8.rs
