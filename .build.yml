image: archlinux
packages:
  - valgrind
  - cmake
  - debuginfod
sources:
  - https://git.sr.ht/~klahr/libu8t
  - https://git.sr.ht/~klahr/unit-check
tasks:
  - setup: |
      cd unit-check
      mkdir -p build
      cd build
      cmake ..
      make
      sudo make install
  - build: |
      cd libu8t
      make
  - run_tests: |
      cd libu8t/tests
      make
      ./tests
  - run_valgrind: |
      cd tests
      export DEBUGINFOD_URLS="https://debuginfod.archlinux.org"
      valgrind --leak-check=full ./tests

